services:
  db:
    image: postgres:17
    container_name: api-learn-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: learn
      POSTGRES_DB: api_learn
    ports:
      - "5434:5432"
    volumes:
      - api-learn-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d api_learn"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  api-learn-pgdata:
